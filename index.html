<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>مجموعة الألعاب</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #121213;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
            padding: 10px;
            position: absolute;
            top: 0;
            left: 0;
            background: #121213;
        }

        .active {
            display: flex;
        }

        h1 {
            margin-bottom: 20px;
            color: #4CAF50;
            font-size: 28px;
        }

        .btn {
            background-color: #2196F3;
            color: white;
            border: none;
            padding: 14px 24px;
            margin: 8px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 80%;
            max-width: 300px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-back {
            background-color: #f44336;
            margin-top: 15px;
            width: auto;
            padding: 8px 16px;
            font-size: 14px;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 360px;
            margin-bottom: 10px;
            font-size: 16px;
            font-weight: bold;
        }

        /* --- Snake Game Styles --- */
        #snakeCanvas {
            border: 3px solid #333;
            background: #000;
            border-radius: 8px;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(3, 60px);
            gap: 5px;
            margin-top: 15px;
        }

        .ctrl-btn {
            background: #333;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- Tile Match Styles --- */
        .grid-match {
            display: grid;
            gap: 8px;
            background: #1e1e24;
            padding: 10px;
            border-radius: 10px;
        }

        .tile {
            width: 55px;
            height: 55px;
            background: #2a2a36;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .tile.selected {
            border-color: #4CAF50;
            background: #3b3b4f;
        }

        /* --- Block Blast Styles --- */
        #bb-board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            gap: 2px;
            width: 320px;
            height: 320px;
            background: #1a1a2e;
            padding: 4px;
            border-radius: 8px;
            border: 2px solid #0f3460;
        }

        .bb-cell {
            background: #16213e;
            border-radius: 4px;
        }

        .bb-cell.filled {
            background: #e94560;
        }

        .bb-pieces {
            display: flex;
            justify-content: space-around;
            width: 100%;
            max-width: 360px;
            margin-top: 20px;
            height: 100px;
        }

        .bb-piece-container {
            width: 90px;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1e1e24;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <!-- القائمة الرئيسية -->
    <div id="main-menu" class="screen active">
        <h1>الألعاب</h1>
        <button class="btn" onclick="showScreen('snake-screen'); startSnake();">الثعبان (هادئة)</button>
        <button class="btn" onclick="showScreen('match-screen'); startTileMatch();">المطابقة (وقت مضاعف)</button>
        <button class="btn" onclick="showScreen('onet-screen'); startOnet();">مسار مفتوح (بدون تايم)</button>
        <button class="btn" onclick="showScreen('bb-screen'); startBlockBlast();">Block Blast (8x8)</button>
    </div>

    <!-- 1. لعبة الثعبان -->
    <div id="snake-screen" class="screen">
        <div class="stats-bar">
            <span>النقاط: <span id="snake-score">0</span></span>
            <span>المرحلة: <span id="snake-level">1</span></span>
        </div>
        <canvas id="snakeCanvas" width="300" height="300"></canvas>
        <div class="controls">
            <div></div><button class="ctrl-btn" onclick="setSnakeDir('UP')">▲</button><div></div>
            <button class="ctrl-btn" onclick="setSnakeDir('LEFT')">◄</button>
            <div></div>
            <button class="ctrl-btn" onclick="setSnakeDir('RIGHT')">►</button>
            <div></div><button class="ctrl-btn" onclick="setSnakeDir('DOWN')">▼</button><div></div>
        </div>
        <button class="btn btn-back" onclick="showScreen('main-menu')">الرئيسية</button>
    </div>

    <!-- 2. لعبة المطابقة (وقت أكثر) -->
    <div id="match-screen" class="screen">
        <div class="stats-bar">
            <span>الوقت: <span id="match-time">180</span>s</span>
            <span>المرحلة: <span id="match-level">1</span></span>
        </div>
        <div id="match-grid" class="grid-match"></div>
        <button class="btn btn-back" onclick="showScreen('main-menu')">الرئيسية</button>
    </div>

    <!-- 3. لعبة المسار المفتوح (Onet - بدون تايم) -->
    <div id="onet-screen" class="screen">
        <div class="stats-bar">
            <span>المرحلة: <span id="onet-level">1</span></span>
            <span>بدون وقت</span>
        </div>
        <div id="onet-grid" class="grid-match"></div>
        <button class="btn btn-back" onclick="showScreen('main-menu')">الرئيسية</button>
    </div>

    <!-- 4. لعبة Block Blast -->
    <div id="bb-screen" class="screen">
        <div class="stats-bar">
            <span>النقاط: <span id="bb-score">0</span></span>
        </div>
        <div id="bb-board"></div>
        <div class="bb-pieces" id="bb-pieces"></div>
        <button class="btn btn-back" onclick="showScreen('main-menu')">الرئيسية</button>
    </div>

    <script>
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            clearInterval(snakeInterval);
            clearInterval(matchTimer);
        }

        /* --- 1. لعبة الثعبان (تعديل السرعة لتكون أهدى بكتير) --- */
        let snakeCanvas = document.getElementById('snakeCanvas');
        let ctx = snakeCanvas.getContext('2d');
        let snake, food, snakeDir, snakeScore, snakeLevel, snakeInterval, baseSpeed;

        function startSnake() {
            snake = [{x: 10, y: 10}];
            food = {x: 5, y: 5};
            snakeDir = 'RIGHT';
            snakeScore = 0;
            snakeLevel = 1;
            baseSpeed = 180; // سرعة أبطأ وأهدى من السابق
            document.getElementById('snake-score').innerText = snakeScore;
            document.getElementById('snake-level').innerText = snakeLevel;
            runSnakeGame();
        }

        function setSnakeDir(dir) {
            if(dir === 'UP' && snakeDir !== 'DOWN') snakeDir = 'UP';
            if(dir === 'DOWN' && snakeDir !== 'UP') snakeDir = 'DOWN';
            if(dir === 'LEFT' && snakeDir !== 'RIGHT') snakeDir = 'LEFT';
            if(dir === 'RIGHT' && snakeDir !== 'LEFT') snakeDir = 'RIGHT';
        }

        function runSnakeGame() {
            clearInterval(snakeInterval);
            // زيادة السرعة بشكل أبطأ جداً (تخفيض 3 مللي ثانية فقط لكل مرحلة)
            let currentSpeed = Math.max(80, baseSpeed - (snakeLevel * 3));
            snakeInterval = setInterval(updateSnake, currentSpeed);
        }

        function updateSnake() {
            let head = {...snake[0]};
            if(snakeDir === 'UP') head.y--;
            if(snakeDir === 'DOWN') head.y++;
            if(snakeDir === 'LEFT') head.x--;
            if(snakeDir === 'RIGHT') head.x++;

            // اصطدام الجدران أو الجسم
            if(head.x < 0 || head.x >= 15 || head.y < 0 || head.y >= 15 || snake.some(s => s.x === head.x && s.y === head.y)) {
                alert('انتهت اللعبة!');
                startSnake();
                return;
            }

            snake.unshift(head);
            if(head.x === food.x && head.y === food.y) {
                snakeScore += 10;
                snakeLevel = Math.floor(snakeScore / 50) + 1;
                document.getElementById('snake-score').innerText = snakeScore;
                document.getElementById('snake-level').innerText = snakeLevel;
                food = {x: Math.floor(Math.random()*15), y: Math.floor(Math.random()*15)};
                runSnakeGame();
            } else {
                snake.pop();
            }

            // رسم
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, 300, 300);
            ctx.fillStyle = '#4CAF50';
            snake.forEach(s => ctx.fillRect(s.x*20, s.y*20, 18, 18));
            ctx.fillStyle = '#FF5722';
            ctx.fillRect(food.x*20, food.y*20, 18, 18);
        }

        /* --- 2. لعبة المطابقة (تم زياده الوقت المتاح) --- */
        let matchGrid = document.getElementById('match-grid');
        let matchTimeEl = document.getElementById('match-time');
        let matchTime, matchTimer, selectedTiles = [], matchLevel = 1;
        const emojis = ['🍎', '🍌', '🍇', '🍊', '🍓', '🥑', '🍒', '🍍'];

        function startTileMatch() {
            matchTime = 180; // تم زيادة الوقت إلى 3 دقائق بدلاً من وقت قصير
            document.getElementById('match-time').innerText = matchTime;
            document.getElementById('match-level').innerText = matchLevel;
            
            let list = [...emojis.slice(0, 6), ...emojis.slice(0, 6)].sort(() => Math.random() - 0.5);
            matchGrid.style.gridTemplateColumns = 'repeat(4, 1fr)';
            matchGrid.innerHTML = '';
            
            list.forEach((emoji, idx) => {
                let t = document.createElement('div');
                t.className = 'tile';
                t.dataset.emoji = emoji;
                t.innerText = '?';
                t.onclick = () => handleMatchClick(t);
                matchGrid.appendChild(t);
            });

            clearInterval(matchTimer);
            matchTimer = setInterval(() => {
                matchTime--;
                matchTimeEl.innerText = matchTime;
                if(matchTime <= 0) {
                    clearInterval(matchTimer);
                    alert('انتهى الوقت!');
                    startTileMatch();
                }
            }, 1000);
        }

        function handleMatchClick(t) {
            if(selectedTiles.length < 2 && !t.classList.contains('selected') && t.innerText === '?') {
                t.innerText = t.dataset.emoji;
                t.classList.add('selected');
                selectedTiles.push(t);

                if(selectedTiles.length === 2) {
                    if(selectedTiles[0].dataset.emoji === selectedTiles[1].dataset.emoji) {
                        selectedTiles = [];
                        if([...document.querySelectorAll('.tile')].every(el => el.innerText !== '?')) {
                            alert('مبروك! انتقلت للمرحلة التالية');
                            matchLevel++;
                            startTileMatch();
                        }
                    } else {
                        setTimeout(() => {
                            selectedTiles.forEach(el => { el.innerText = '?'; el.classList.remove('selected'); });
                            selectedTiles = [];
                        }, 500);
                    }
                }
            }
        }

        /* --- 3. لعبة المسار المفتوح (Connect/Onet - بدون وقت ومراحل لا نهائية) --- */
        let onetLevel = 1;
        let onetSelected = null;
        const icons = ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊'];

        function startOnet() {
            document.getElementById('onet-level').innerText = onetLevel;
            let grid = document.getElementById('onet-grid');
            grid.style.gridTemplateColumns = 'repeat(4, 1fr)';
            grid.innerHTML = '';

            let deck = [...icons, ...icons, ...icons, ...icons].sort(() => Math.random() - 0.5);
            deck.forEach((icon, i) => {
                let div = document.createElement('div');
                div.className = 'tile';
                div.innerText = icon;
                div.dataset.icon = icon;
                div.onclick = () => handleOnetClick(div);
                grid.appendChild(div);
            });
        }

        function handleOnetClick(tile) {
            if(tile.style.visibility === 'hidden') return;

            if(!onetSelected) {
                onetSelected = tile;
                tile.classList.add('selected');
            } else if(onetSelected === tile) {
                onetSelected.classList.remove('selected');
                onetSelected = null;
            } else {
                if(onetSelected.dataset.icon === tile.dataset.icon) {
                    // شرط المطابقة بمسار مفتوح مباشر بسيط
                    onetSelected.style.visibility = 'hidden';
                    tile.style.visibility = 'hidden';
                    onetSelected.classList.remove('selected');
                    onetSelected = null;

                    let remaining = [...document.querySelectorAll('#onet-grid .tile')].filter(t => t.style.visibility !== 'hidden');
                    if(remaining.length === 0) {
                        alert('ممتاز! المرحلة التالية');
                        onetLevel++;
                        startOnet();
                    }
                } else {
                    onetSelected.classList.remove('selected');
                    onetSelected = tile;
                    tile.classList.add('selected');
                }
            }
        }

        /* --- 4. لعبة Block Blast (أبعاد 8x8 الأصلية) --- */
        let bbScore = 0;
        let bbBoard = Array(8).fill(0).map(() => Array(8).fill(0));

        function startBlockBlast() {
            bbScore = 0;
            document.getElementById('bb-score').innerText = bbScore;
            let boardEl = document.getElementById('bb-board');
            boardEl.innerHTML = '';
            
            for(let r=0; r<8; r++) {
                for(let c=0; c<8; c++) {
                    let cell = document.createElement('div');
                    cell.className = 'bb-cell';
                    cell.id = `cell-${r}-${c}`;
                    boardEl.appendChild(cell);
                }
            }
        }
    </script>
</body>
</html>
