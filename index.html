<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Water Sort Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        :root {
            --bg-main: #0f172a;
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --text: #f8fafc;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0; padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background: var(--bg-main);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #0b1120;
        }

        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column;
            align-items: center; justify-content: space-between;
            padding: 30px 20px; opacity: 0; pointer-events: none;
            transition: opacity 0.3s; z-index: 1;
        }

        .screen.active { opacity: 1; pointer-events: all; z-index: 2; }

        /* واجهة البداية */
        .logo-box { text-align: center; margin-top: 80px; }
        .logo-icon { font-size: 80px; }
        .logo-title { font-size: 32px; font-weight: 900; color: #38bdf8; margin-top: 10px; }

        .btn-ui {
            width: 100%; padding: 16px; border-radius: 20px;
            border: 1px solid var(--glass-border); background: var(--glass-bg);
            color: #fff; font-size: 18px; font-weight: bold; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-primary { background: linear-gradient(135deg, #0284c7, #6366f1); border: none; }

        /* شبكة المراحل */
        .levels-grid {
            width: 100%; flex: 1; margin: 20px 0;
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
            overflow-y: auto;
        }
        .level-card {
            aspect-ratio: 1; border-radius: 16px; background: var(--glass-bg);
            border: 1px solid var(--glass-border); display: flex;
            align-items: center; justify-content: center; font-size: 20px; font-weight: bold;
        }
        .level-card.completed { background: rgba(34, 197, 94, 0.2); border-color: #22c55e; color: #4ade80; }

        /* منطقة اللعب */
        .game-header { width: 100%; display: flex; justify-content: space-between; align-items: center; }
        .btn-icon { width: 45px; height: 45px; border-radius: 50%; border: 1px solid var(--glass-border); background: var(--glass-bg); color: #fff; font-size: 18px; }

        .bottles-stage {
            width: 100%; flex: 1; display: flex; flex-wrap: wrap;
            justify-content: center; align-content: center; gap: 60px 22px;
            position: relative;
        }

        /* الزجاجة بضبط نقطة الارتكاز عند الفوهة */
        .bottle-wrapper {
            width: 44px; height: 160px;
            position: relative;
            transform-origin: top center;
            z-index: 10;
        }

        .bottle {
            width: 100%; height: 100%;
            border: 3px solid rgba(255, 255, 255, 0.9);
            border-top: none; border-radius: 0 0 22px 22px;
            display: flex; flex-direction: column-reverse;
            overflow: hidden; background: rgba(255, 255, 255, 0.05);
            box-shadow: inset 0 0 10px rgba(255,255,255,0.2);
            position: relative;
        }

        .bottle::before {
            content: ''; position: absolute; top: -6px; left: -4px; right: -4px; height: 6px;
            border: 3px solid rgba(255, 255, 255, 0.9); border-radius: 4px;
        }

        .liquid-layer { width: 100%; height: 25%; transition: height 0.2s; }

        /* شعاع السائل المنهمر */
        .pour-stream {
            position: absolute;
            width: 8px;
            height: 0;
            border-radius: 4px;
            z-index: 999;
            pointer-events: none;
            opacity: 0;
            top: 0;
        }

        .modal-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0, 0, 0, 0.85); display: flex;
            justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: 0.3s; z-index: 1000;
        }
        .modal-overlay.show { opacity: 1; pointer-events: all; }
        .modal-card { background: #1e293b; padding: 30px; border-radius: 24px; text-align: center; width: 80%; }
    </style>
</head>
<body>

    <div class="app-container">

        <!-- واجهة البداية -->
        <div class="screen active" id="screen-menu">
            <div class="logo-box">
                <div class="logo-icon">🧪</div>
                <div class="logo-title">فرز الألوان</div>
            </div>
            <div style="width: 100%; display: flex; flex-direction: column; gap: 15px; margin-bottom: 50px;">
                <button class="btn-ui btn-primary" onclick="playCurrentLevel()">بدء اللعب ▶️</button>
                <button class="btn-ui" onclick="showScreen('screen-levels')">المراحل 🏆</button>
            </div>
        </div>

        <!-- واجهة المراحل -->
        <div class="screen" id="screen-levels">
            <div class="game-header">
                <button class="btn-icon" onclick="showScreen('screen-menu')">➔</button>
                <h2>المراحل</h2>
                <div style="width: 45px;"></div>
            </div>
            <div class="levels-grid" id="levels-grid"></div>
        </div>

        <!-- واجهة اللعب -->
        <div class="screen" id="screen-game">
            <div class="game-header">
                <button class="btn-icon" onclick="showScreen('screen-levels')">➔</button>
                <h3 id="game-level-title">المرحلة 1</h3>
                <button class="btn-icon" onclick="initGameStage()">🔄</button>
            </div>

            <div class="bottles-stage" id="bottles-stage">
                <div class="pour-stream" id="pour-stream"></div>
            </div>
        </div>

        <!-- نافذة الفوز -->
        <div class="modal-overlay" id="win-modal">
            <div class="modal-card">
                <h1 style="font-size: 50px;">🎉</h1>
                <h2 style="color: #4ade80; margin: 10px 0;">ممتاز!</h2>
                <button class="btn-ui btn-primary" onclick="nextLevel()">المرحلة التالية ➡️</button>
            </div>
        </div>

    </div>

    <script>
        const COLORS = ['#ef4444', '#3b82f6', '#22c55e', '#eab308', '#a855f7', '#ec4899'];
        let currentLevel = parseInt(localStorage.getItem('ws_lvl')) || 1;
        let selectedBottleIdx = null;
        let bottlesData = [];
        let isPouring = false;

        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            initAudio();
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);

            if (type === 'tap') {
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                osc.start(); osc.stop(audioCtx.currentTime + 0.08);
            } else if (type === 'pour') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(350, audioCtx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start(); osc.stop(audioCtx.currentTime + 0.4);
            } else if (type === 'win') {
                [300, 450, 600, 800].forEach((f, i) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.connect(g); g.connect(audioCtx.destination);
                    o.frequency.value = f;
                    g.gain.setValueAtTime(0.1, audioCtx.currentTime + i * 0.1);
                    g.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.1 + 0.2);
                    o.start(audioCtx.currentTime + i * 0.1);
                    o.stop(audioCtx.currentTime + i * 0.1 + 0.2);
                });
            }
        }

        document.body.addEventListener('click', initAudio, { once: true });

        function showScreen(id) {
            playSound('tap');
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if (id === 'screen-levels') renderLevelsGrid();
        }

        function renderLevelsGrid() {
            const grid = document.getElementById('levels-grid');
            grid.innerHTML = '';
            for (let i = 1; i <= 100; i++) {
                const card = document.createElement('div');
                card.className = `level-card ${i < currentLevel ? 'completed' : ''}`;
                card.innerText = i;
                if (i <= currentLevel) card.onclick = () => { currentLevel = i; startLevel(i); };
                grid.appendChild(card);
            }
        }

        function playCurrentLevel() { startLevel(currentLevel); }
        function startLevel(lvl) {
            currentLevel = lvl;
            showScreen('screen-game');
            document.getElementById('game-level-title').innerText = `المرحلة ${lvl}`;
            initGameStage();
        }

        function initGameStage() {
            document.getElementById('win-modal').classList.remove('show');
            selectedBottleIdx = null; isPouring = false;
            let colorCount = Math.min(2 + Math.floor((currentLevel - 1) / 2), 5);
            let totalBottles = colorCount + 2;

            let pool = [];
            for (let i = 0; i < colorCount; i++) {
                for (let j = 0; j < 4; j++) pool.push(COLORS[i]);
            }
            pool.sort(() => Math.random() - 0.5);

            bottlesData = [];
            for (let i = 0; i < colorCount; i++) bottlesData.push(pool.slice(i * 4, (i + 1) * 4));
            for (let i = 0; i < totalBottles - colorCount; i++) bottlesData.push([]);

            renderBottles();
        }

        function renderBottles() {
            const stage = document.getElementById('bottles-stage');
            const stream = document.getElementById('pour-stream');
            stage.innerHTML = '';
            stage.appendChild(stream);

            bottlesData.forEach((stack, idx) => {
                const wrap = document.createElement('div');
                wrap.className = 'bottle-wrapper';
                wrap.id = `wrap-${idx}`;

                const b = document.createElement('div');
                b.className = 'bottle';
                b.onclick = () => onBottleClick(idx);

                stack.forEach(color => {
                    const l = document.createElement('div');
                    l.className = 'liquid-layer';
                    l.style.backgroundColor = color;
                    b.appendChild(l);
                });

                wrap.appendChild(b);
                stage.appendChild(wrap);
            });
        }

        function onBottleClick(idx) {
            if (isPouring) return;
            const wraps = document.querySelectorAll('.bottle-wrapper');

            if (selectedBottleIdx === null) {
                if (bottlesData[idx].length > 0) {
                    selectedBottleIdx = idx;
                    playSound('tap');
                    gsap.to(wraps[idx], { y: -30, duration: 0.2 });
                }
            } else if (selectedBottleIdx === idx) {
                gsap.to(wraps[idx], { y: 0, duration: 0.2 });
                selectedBottleIdx = null;
            } else {
                const src = bottlesData[selectedBottleIdx];
                const dest = bottlesData[idx];

                if (dest.length < 4 && (dest.length === 0 || dest[dest.length - 1] === src[src.length - 1])) {
                    pourAnimation(selectedBottleIdx, idx);
                } else {
                    gsap.to(wraps[selectedBottleIdx], { y: 0, duration: 0.2 });
                    if (bottlesData[idx].length > 0) {
                        selectedBottleIdx = idx;
                        playSound('tap');
                        gsap.to(wraps[idx], { y: -30, duration: 0.2 });
                    } else {
                        selectedBottleIdx = null;
                    }
                }
            }
        }

        function pourAnimation(fromIdx, toIdx) {
            isPouring = true;
            const stage = document.getElementById('bottles-stage');
            const wraps = document.querySelectorAll('.bottle-wrapper');
            const srcWrap = wraps[fromIdx];
            const destWrap = wraps[toIdx];
            const stream = document.getElementById('pour-stream');

            // إعادة الترتيب في الـ DOM لضمان الظهور في المقدمة الشديدة
            stage.appendChild(srcWrap);

            const srcRect = srcWrap.getBoundingClientRect();
            const destRect = destWrap.getBoundingClientRect();

            const isRightToLeft = srcRect.left > destRect.left;
            const tilt = isRightToLeft ? -75 : 75;

            // رفع الزجاجة أعلى بمقدار كبير (65px) لعدم التداخل
            const targetX = (destRect.left - srcRect.left) + (isRightToLeft ? 38 : -38);
            const targetY = (destRect.top - srcRect.top) - 65;

            const currentColor = bottlesData[fromIdx][bottlesData[fromIdx].length - 1];

            const tl = gsap.timeline({
                onComplete: () => {
                    const src = bottlesData[fromIdx];
                    const dest = bottlesData[toIdx];
                    while (src.length > 0 && src[src.length - 1] === currentColor && dest.length < 4) {
                        dest.push(src.pop());
                    }
                    selectedBottleIdx = null;
                    renderBottles();
                    isPouring = false;
                    checkWin();
                }
            });

            tl.to(srcWrap, { x: targetX, y: targetY, duration: 0.35, ease: "power2.out" })
              .to(srcWrap, { rotation: tilt, duration: 0.25, ease: "power1.in" })
              .call(() => {
                  playSound('pour');
                  
                  const stageRect = stage.getBoundingClientRect();
                  const mouthX = destRect.left + (destRect.width / 2) - stageRect.left;
                  const mouthY = destRect.top - stageRect.top - 10;

                  gsap.set(stream, {
                      x: mouthX - 4,
                      y: mouthY,
                      height: 70, // إطالة الشعاع ليغطي المسافة العالية الجديدة
                      backgroundColor: currentColor,
                      opacity: 1
                  });
              })
              .to(srcWrap, { duration: 0.45 })
              .call(() => {
                  gsap.to(stream, { opacity: 0, height: 0, duration: 0.1 });
              })
              .to(srcWrap, { rotation: 0, duration: 0.2 })
              .to(srcWrap, { x: 0, y: 0, duration: 0.35 });
        }

        function checkWin() {
            const win = bottlesData.every(b => b.length === 0 || (b.length === 4 && b.every(c => c === b[0])));
            if (win) {
                playSound('win');
                if (currentLevel >= (parseInt(localStorage.getItem('ws_lvl')) || 1)) {
                    localStorage.setItem('ws_lvl', currentLevel + 1);
                }
                setTimeout(() => document.getElementById('win-modal').classList.add('show'), 300);
            }
        }

        function nextLevel() { currentLevel++; startLevel(currentLevel); }
    </script>
</body>
</html>
