<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>فرز المياه - Water Sort Game</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            font-family: system-ui, -apple-system, Roboto, sans-serif;
            background: radial-gradient(circle at top, #1e293b, #0f172a);
            color: #fff;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
            padding: 15px;
        }

        /* الهيدر */
        header {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 12px 20px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .level-badge {
            font-size: 20px;
            font-weight: 800;
            color: #38bdf8;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        .btn-icon {
            background: #334155;
            color: #fff;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, background 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .btn-icon:active {
            transform: scale(0.88);
            background: #475569;
        }

        /* منطقة اللعب */
        .game-area {
            flex: 1;
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .bottles-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-content: center;
            gap: 35px 20px;
            width: 100%;
            padding: 20px 0;
        }

        /* تصميم الزجاجة احترافي */
        .bottle {
            width: 46px;
            height: 160px;
            border: 3px solid rgba(255, 255, 255, 0.85);
            border-top: none;
            border-radius: 0 0 24px 24px;
            position: relative;
            cursor: pointer;
            display: flex;
            flex-direction: column-reverse;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.03);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5), inset 0 0 10px rgba(255, 255, 255, 0.1);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), border-color 0.3s;
            transform-origin: center bottom;
        }

        /* فوهة الزجاجة */
        .bottle::before {
            content: '';
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 52px;
            height: 8px;
            border: 3px solid rgba(255, 255, 255, 0.85);
            border-radius: 4px;
            box-sizing: border-box;
        }

        /* لمعة الزجاج */
        .bottle::after {
            content: '';
            position: absolute;
            top: 0; left: 4px; width: 6px; height: 100%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.4), rgba(255,255,255,0.05));
            border-radius: 3px;
            z-index: 5;
            pointer-events: none;
        }

        .bottle.selected {
            transform: translateY(-22px);
            border-color: #38bdf8;
            box-shadow: 0 15px 30px rgba(56, 189, 248, 0.4);
        }

        /* أساليب السوائل */
        .liquid {
            width: 100%;
            height: 25%;
            transition: height 0.4s ease-in-out;
            position: relative;
        }

        /* أنيميشن تدفق السائل */
        .pour-stream {
            position: absolute;
            width: 8px;
            border-radius: 4px;
            z-index: 100;
            pointer-events: none;
            transition: all 0.3s ease;
            transform-origin: top center;
        }

        /* نافذة الفوز */
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            z-index: 1000;
        }

        .modal.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-card {
            background: #1e293b;
            border: 2px solid #38bdf8;
            padding: 35px 25px;
            border-radius: 28px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            transform: scale(0.7);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 320px;
            width: 90%;
        }

        .modal.active .modal-card {
            transform: scale(1);
        }

        .modal h2 {
            margin: 0 0 10px;
            font-size: 28px;
            color: #4ade80;
        }

        .btn-main {
            background: linear-gradient(135deg, #38bdf8, #3b82f6);
            color: #fff;
            border: none;
            padding: 14px 28px;
            border-radius: 14px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4);
            transition: transform 0.2s;
            width: 100%;
        }

        .btn-main:active {
            transform: scale(0.95);
        }

        /* قصاصات الاحتفال بالفوز */
        canvas#confetti {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 999;
        }
    </style>
</head>
<body>

    <header>
        <div class="level-badge" id="level-title">المرحلة 1</div>
        <div class="controls">
            <button class="btn-icon" onclick="restartLevel()" title="إعادة">🔄</button>
        </div>
    </header>

    <div class="game-area">
        <div class="bottles-grid" id="grid"></div>
        <div class="pour-stream" id="stream"></div>
    </div>

    <div class="modal" id="winModal">
        <div class="modal-card">
            <h2>ممتاز! 🎉</h2>
            <p style="color: #94a3b8; margin-bottom: 20px;">تم ترتيب الألوان بنجاح</p>
            <button class="btn-main" onclick="nextLevel()">المرحلة التالية ➡️</button>
        </div>
    </div>

    <canvas id="confetti"></canvas>

    <script>
        // لوحة الألوان الزاهية والمجسمة
        const COLOR_PALETTE = [
            '#ef4444', '#3b82f6', '#22c55e', '#eab308', 
            '#a855f7', '#ec4899', '#14b8a6', '#f97316', 
            '#06b6d4', '#8b5cf6'
        ];

        // مبرمج مؤشرات الصوت (Web Audio API بدون ملفات خارجية)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'select') {
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'pour') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(250, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(150, audioCtx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                osc.start(); osc.stop(audioCtx.currentTime + 0.25);
            } else if (type === 'win') {
                const notes = [261, 329, 392, 523];
                notes.forEach((freq, i) => {
                    const noteOsc = audioCtx.createOscillator();
                    const noteGain = audioCtx.createGain();
                    noteOsc.connect(noteGain);
                    noteGain.connect(audioCtx.destination);
                    noteOsc.frequency.value = freq;
                    noteGain.gain.setValueAtTime(0.15, audioCtx.currentTime + i * 0.1);
                    noteGain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.1 + 0.25);
                    noteOsc.start(audioCtx.currentTime + i * 0.1);
                    noteOsc.stop(audioCtx.currentTime + i * 0.1 + 0.25);
                });
            }
        }

        let currentLevel = parseInt(localStorage.getItem('water_sort_lvl')) || 1;
        let selectedIndex = null;
        let bottles = [];
        let isAnimating = false;

        // حساب عدد الأزايز المتزايد بذكاء حسب رقم المرحلة
        function getLevelConfig(lvl) {
            // يبدأ بـ 3 ألوان ويصل حتى 8 ألوان مع التقدم
            let colorCount = Math.min(3 + Math.floor((lvl - 1) / 3), 8);
            let emptyBottles = 2;
            return { colorCount, totalBottles: colorCount + emptyBottles };
        }

        function initLevel() {
            document.getElementById('level-title').innerText = `المرحلة ${currentLevel}`;
            document.getElementById('winModal').classList.remove('active');
            selectedIndex = null;
            isAnimating = false;

            const config = getLevelConfig(currentLevel);
            let colors = [];
            
            for (let i = 0; i < config.colorCount; i++) {
                for (let j = 0; j < 4; j++) {
                    colors.push(COLOR_PALETTE[i]);
                }
            }

            // خلط عشوائي للألوان
            colors.sort(() => Math.random() - 0.5);

            bottles = [];
            for (let i = 0; i < config.colorCount; i++) {
                bottles.push(colors.slice(i * 4, (i + 1) * 4));
            }
            for (let i = 0; i < config.totalBottles - config.colorCount; i++) {
                bottles.push([]);
            }

            render();
        }

        function render() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';

            bottles.forEach((stack, idx) => {
                const b = document.createElement('div');
                b.className = `bottle ${selectedIndex === idx ? 'selected' : ''}`;
                
                b.onclick = () => onBottleClick(idx);

                stack.forEach(color => {
                    const l = document.createElement('div');
                    l.className = 'liquid';
                    l.style.backgroundColor = color;
                    b.appendChild(l);
                });

                grid.appendChild(b);
            });
        }

        async function onBottleClick(idx) {
            if (isAnimating) return;

            if (selectedIndex === null) {
                if (bottles[idx].length > 0) {
                    selectedIndex = idx;
                    playSound('select');
                    render();
                }
            } else if (selectedIndex === idx) {
                selectedIndex = null;
                render();
            } else {
                const src = bottles[selectedIndex];
                const dest = bottles[idx];

                if (src.length === 0) {
                    selectedIndex = null;
                    render();
                    return;
                }

                const colorToPour = src[src.length - 1];
                if (dest.length < 4 && (dest.length === 0 || dest[dest.length - 1] === colorToPour)) {
                    isAnimating = true;
                    await animatePour(selectedIndex, idx, colorToPour);
                    
                    while (src.length > 0 && src[src.length - 1] === colorToPour && dest.length < 4) {
                        dest.push(src.pop());
                    }
                    
                    selectedIndex = null;
                    render();
                    isAnimating = false;
                    checkWin();
                } else {
                    selectedIndex = idx;
                    playSound('select');
                    render();
                }
            }
        }

        // أنيميشن سكب الماء
        function animatePour(fromIdx, toIdx, color) {
            return new Promise(resolve => {
                const bottleElements = document.querySelectorAll('.bottle');
                const srcEl = bottleElements[fromIdx];
                const destEl = bottleElements[toIdx];
                
                const srcRect = srcEl.getBoundingClientRect();
                const destRect = destEl.getBoundingClientRect();

                playSound('pour');

                // إمالة زجاجة المصدر
                const angle = (destRect.left > srcRect.left) ? 45 : -45;
                srcEl.style.transform = `translate(${destRect.left - srcRect.left}px, ${destRect.top - srcRect.top - 50}px) rotate(${angle}deg)`;
                srcEl.style.zIndex = '50';

                const stream = document.getElementById('stream');
                setTimeout(() => {
                    stream.style.backgroundColor = color;
                    stream.style.top = (destRect.top - 20) + 'px';
                    stream.style.left = (destRect.left + 20) + 'px';
                    stream.style.height = '60px';
                    stream.style.opacity = '1';
                }, 200);

                setTimeout(() => {
                    stream.style.opacity = '0';
                    stream.style.height = '0px';
                    srcEl.style.transform = '';
                    srcEl.style.zIndex = '1';
                    setTimeout(resolve, 200);
                }, 500);
            });
        }

        function checkWin() {
            const win = bottles.every(b => b.length === 0 || (b.length === 4 && b.every(c => c === b[0])));
            if (win) {
                playSound('win');
                startConfetti();
                setTimeout(() => {
                    document.getElementById('winModal').classList.add('active');
                }, 400);
            }
        }

        function nextLevel() {
            currentLevel++;
            localStorage.setItem('water_sort_lvl', currentLevel);
            initLevel();
        }

        function restartLevel() {
            initLevel();
        }

        // قصاصات ورقية ملونة عند الفوز
        function startConfetti() {
            const canvas = document.getElementById('confetti');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            let pieces = Array.from({length: 80}, () => ({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height - canvas.height,
                size: Math.random() * 8 + 4,
                color: COLOR_PALETTE[Math.floor(Math.random() * COLOR_PALETTE.length)],
                speed: Math.random() * 5 + 3,
                rot: Math.random() * 360
            }));

            function draw() {
                ctx.clearRect(0,0,canvas.width,canvas.height);
                pieces.forEach(p => {
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rot);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
                    ctx.restore();

                    p.y += p.speed;
                    p.rot += 0.1;
                });

                if (pieces.some(p => p.y < canvas.height)) {
                    requestAnimationFrame(draw);
                } else {
                    ctx.clearRect(0,0,canvas.width,canvas.height);
                }
            }
            draw();
        }

        initLevel();
    </script>
</body>
</html>
