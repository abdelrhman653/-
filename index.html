<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Hub Ultimate</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.7);
            --accent-color: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.4);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
            --radius-lg: 20px;
            --radius-md: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0f172a 75%);
        }

        /* Top Header Navigation */
        .app-header {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            padding: 10px 16px;
            border-radius: var(--radius-lg);
            margin-bottom: 12px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .header-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 14px;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-btn:active {
            transform: scale(0.95);
            background: var(--accent-color);
        }

        /* Stats Bar & Panels */
        .game-panel {
            width: 100%;
            max-width: 480px;
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .stats-bar {
            width: 100%;
            display: flex;
            justify-content: space-around;
            background: rgba(15, 23, 42, 0.6);
            padding: 10px;
            border-radius: var(--radius-md);
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stat-box {
            text-align: center;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 2px;
        }

        .stat-value {
            font-size: 1.1rem;
            font-weight: 700;
            color: #f43f5e;
        }

        /* Hub Screen Games Menu */
        .games-grid {
            width: 100%;
            max-width: 480px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .menu-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 20px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.25s ease;
            text-align: center;
        }

        .menu-card:active {
            transform: scale(0.96);
            border-color: var(--accent-color);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .menu-icon {
            font-size: 2.2rem;
        }

        .menu-title {
            font-size: 0.95rem;
            font-weight: 700;
        }

        /* Custom Modal / Dialog */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: #1e293b;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 24px;
            width: 85%;
            max-width: 340px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .modal-title {
            font-size: 1.4rem;
            color: #4ade80;
            margin-bottom: 8px;
            font-weight: 900;
        }

        .modal-btn {
            margin-top: 16px;
            width: 100%;
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 10px;
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 14px var(--accent-glow);
        }

        /* Game Specific Fixes */
        /* Snake LTR Controls Fix */
        .controls-grid {
            direction: ltr !important;
            display: grid;
            grid-template-columns: repeat(3, 50px);
            grid-template-rows: repeat(3, 50px);
            gap: 8px;
            margin-top: 15px;
        }

        .ctrl-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border-color);
            color: white;
            font-size: 1.2rem;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ctrl-btn:active { background: var(--accent-color); }

        /* Block Blast Grid Fix */
        .block-grid {
            direction: ltr !important;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 4px;
            background: rgba(15, 23, 42, 0.8);
            padding: 6px;
            border-radius: var(--radius-md);
            width: 100%;
            max-width: 320px;
            aspect-ratio: 1;
        }

        .block-cell {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            transition: background 0.1s;
        }

        .block-cell.filled { background: #f97316; box-shadow: inset 0 0 4px rgba(0,0,0,0.3); }
        .block-cell.preview { background: rgba(249, 115, 22, 0.4); }

        /* Memory Grid */
        .memory-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            width: 100%;
            max-width: 320px;
        }

        .memory-card {
            aspect-ratio: 1;
            background: #334155;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            cursor: pointer;
            transition: transform 0.3s ease, background 0.3s;
        }

        .memory-card.flipped { background: #475569; }

        /* Ball Sort Tubes */
        .tubes-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 10px;
            width: 100%;
        }

        .tube {
            width: 48px;
            height: 170px;
            border: 3px solid rgba(255,255,255,0.2);
            border-top: none;
            border-radius: 0 0 24px 24px;
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            padding-bottom: 6px;
            gap: 4px;
            background: rgba(0,0,0,0.2);
        }

        .ball {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            box-shadow: inset -3px -3px 6px rgba(0,0,0,0.4);
            transition: transform 0.2s ease;
        }

        /* Connect Animals Grid */
        .connect-grid {
            direction: ltr !important;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 4px;
            width: 100%;
            max-width: 330px;
        }

        .connect-cell {
            aspect-ratio: 1;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .connect-cell.selected { border-color: #38bdf8; background: rgba(56, 189, 248, 0.2); }
        .connect-cell.empty { background: transparent; cursor: default; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Top App Header -->
    <header class="app-header">
        <div class="header-title">🎮 مركز الألعاب</div>
        <button class="nav-btn" id="homeBtn" onclick="showHub()">🏠 القائمة</button>
    </header>

    <!-- Main Hub Screen -->
    <div id="hubScreen" class="games-grid">
        <div class="menu-card" onclick="startGame('sort')">
            <div class="menu-icon">🧪</div>
            <div class="menu-title">فرز الألوان</div>
        </div>
        <div class="menu-card" onclick="startGame('block')">
            <div class="menu-icon">🧩</div>
            <div class="menu-title">Block Blast</div>
        </div>
        <div class="menu-card" onclick="startGame('memory')">
            <div class="menu-icon">🎴</div>
            <div class="menu-title">تطابق الذاكرة</div>
        </div>
        <div class="menu-card" onclick="startGame('connect')">
            <div class="menu-icon">🐾</div>
            <div class="menu-title">توصيل الحيوانات</div>
        </div>
        <div class="menu-card" onclick="startGame('snake')">
            <div class="menu-icon">🐍</div>
            <div class="menu-title">الثعبان الكلاسيكي</div>
        </div>
        <div class="menu-card" onclick="playSound('click')">
            <div class="menu-icon">⚙️</div>
            <div class="menu-title">الإعدادات</div>
        </div>
    </div>

    <!-- Game Container View -->
    <div id="gameScreen" class="game-panel hidden">
        <div class="stats-bar">
            <div class="stat-box">
                <div class="stat-label" id="stat1Label">المرحلة</div>
                <div class="stat-value" id="stat1Val">1</div>
            </div>
            <div class="stat-box">
                <div class="stat-label" id="stat2Label">النقاط</div>
                <div class="stat-value" id="stat2Val">0</div>
            </div>
            <div class="stat-box" id="stat3Box">
                <div class="stat-label" id="stat3Label">الوقت</div>
                <div class="stat-value" id="stat3Val">00:00</div>
            </div>
        </div>

        <div id="gameBody" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
            <!-- Game content rendered here -->
        </div>
    </div>

    <!-- Custom Victory Modal -->
    <div class="modal-overlay" id="winModal">
        <div class="modal-card">
            <div class="modal-title">🎉 أداء رائع!</div>
            <p style="color: var(--text-muted);" id="modalMsg">لقد أكملت المرحلة بنجاح!</p>
            <button class="modal-btn" onclick="closeModal()">المرحلة التالية ➔</button>
        </div>
    </div>

    <script>
        /* --- Web Audio Synthesizer Engine --- */
        const AudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (AudioCtx.state === 'suspended') AudioCtx.resume();
            const osc = AudioCtx.createOscillator();
            const gain = AudioCtx.createGain();
            osc.connect(gain);
            gain.connect(AudioCtx.destination);

            if (type === 'pop') {
                osc.frequency.setValueAtTime(400, AudioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, AudioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.3, AudioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, AudioCtx.currentTime + 0.08);
                osc.start(); osc.stop(AudioCtx.currentTime + 0.08);
            } else if (type === 'click') {
                osc.frequency.setValueAtTime(200, AudioCtx.currentTime);
                gain.gain.setValueAtTime(0.2, AudioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, AudioCtx.currentTime + 0.05);
                osc.start(); osc.stop(AudioCtx.currentTime + 0.05);
            } else if (type === 'win') {
                const now = AudioCtx.currentTime;
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.1);
                osc.frequency.setValueAtTime(783.99, now + 0.2);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
                osc.start(); osc.stop(now + 0.4);
            }
        }

        /* --- App Flow Control --- */
        let currentGame = null;
        let timerInterval = null;
        let secondsElapsed = 0;

        function showHub() {
            clearInterval(timerInterval);
            document.getElementById('hubScreen').classList.remove('hidden');
            document.getElementById('gameScreen').classList.add('hidden');
            currentGame = null;
        }

        function startGame(gameKey) {
            playSound('click');
            document.getElementById('hubScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.remove('hidden');
            currentGame = gameKey;
            resetTimer();

            if (gameKey === 'sort') initSortGame();
            if (gameKey === 'memory') initMemoryGame();
            if (gameKey === 'snake') initSnakeGame();
            if (gameKey === 'block') initBlockBlast();
            if (gameKey === 'connect') initConnectGame();
        }

        function triggerWin(msg = "أكملت المستوى بنجاح!") {
            playSound('win');
            clearInterval(timerInterval);
            document.getElementById('modalMsg').innerText = msg;
            document.getElementById('winModal').classList.add('active');
        }

        function closeModal() {
            playSound('click');
            document.getElementById('winModal').classList.remove('active');
            if (currentGame) startGame(currentGame);
        }

        function resetTimer() {
            clearInterval(timerInterval);
            secondsElapsed = 0;
            document.getElementById('stat3Val').innerText = "00:00";
            timerInterval = setInterval(() => {
                secondsElapsed++;
                const m = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
                const s = String(secondsElapsed % 60).padStart(2, '0');
                document.getElementById('stat3Val').innerText = `${m}:${s}`;
            }, 1000);
        }

        /* --- 1. Ball Sort Game --- */
        let tubesData = [];
        const colors = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b'];
        let selectedTube = null;

        function initSortGame() {
            document.getElementById('stat1Label').innerText = "المرحلة";
            document.getElementById('stat1Val').innerText = "1";
            document.getElementById('stat2Label').innerText = "النقاط";
            document.getElementById('stat2Val').innerText = "100";

            tubesData = [
                ['#ef4444', '#3b82f6', '#ef4444', '#10b981'],
                ['#3b82f6', '#10b981', '#3b82f6', '#ef4444'],
                ['#10b981', '#ef4444', '#10b981', '#3b82f6'],
                [], []
            ];
            renderSort();
        }

        function renderSort() {
            const body = document.getElementById('gameBody');
            body.innerHTML = `<div class="tubes-container" id="tubesHolder"></div>`;
            const holder = document.getElementById('tubesHolder');

            tubesData.forEach((tube, idx) => {
                const tDiv = document.createElement('div');
                tDiv.className = 'tube';
                if (selectedTube === idx) tDiv.style.borderColor = '#38bdf8';
                tDiv.onclick = () => handleTubeClick(idx);

                tube.forEach(col => {
                    const b = document.createElement('div');
                    b.className = 'ball';
                    b.style.backgroundColor = col;
                    tDiv.appendChild(b);
                });
                holder.appendChild(tDiv);
            });
        }

        function handleTubeClick(idx) {
            playSound('pop');
            if (selectedTube === null) {
                if (tubesData[idx].length > 0) selectedTube = idx;
            } else {
                if (selectedTube !== idx) {
                    const src = tubesData[selectedTube];
                    const dest = tubesData[idx];
                    if (dest.length < 4) {
                        dest.push(src.pop());
                    }
                }
                selectedTube = null;
            }
            renderSort();
            checkSortWin();
        }

        function checkSortWin() {
            let win = true;
            tubesData.forEach(t => {
                if (t.length > 0 && t.length < 4) win = false;
                if (t.length === 4 && !t.every(val => val === t[0])) win = false;
            });
            if (win) triggerWin("ممتاز! تم فرز كل الألوان بنجاح.");
        }

        /* --- 2. Memory Match Game --- */
        let memoryCards = [];
        let flippedCards = [];
        let matchedPairs = 0;

        function initMemoryGame() {
            document.getElementById('stat1Label').innerText = "المرحلة";
            document.getElementById('stat1Val').innerText = "1";
            document.getElementById('stat2Label').innerText = "الحركات";
            document.getElementById('stat2Val').innerText = "0";

            const icons = ['🐶', '🐱', '🦊', '🐻', '🐰', '🐼'];
            const deck = [...icons, ...icons].sort(() => Math.random() - 0.5);
            matchedPairs = 0;
            flippedCards = [];

            const body = document.getElementById('gameBody');
            body.innerHTML = `<div class="memory-grid" id="memGrid"></div>`;
            const grid = document.getElementById('memGrid');

            deck.forEach((icon, i) => {
                const card = document.createElement('div');
                card.className = 'memory-card';
                card.dataset.icon = icon;
                card.dataset.index = i;
                card.onclick = () => flipMemoryCard(card);
                grid.appendChild(card);
            });
        }

        function flipMemoryCard(card) {
            if (flippedCards.length < 2 && !card.classList.contains('flipped')) {
                playSound('pop');
                card.classList.add('flipped');
                card.innerText = card.dataset.icon;
                flippedCards.push(card);

                if (flippedCards.length === 2) {
                    let moves = parseInt(document.getElementById('stat2Val').innerText) + 1;
                    document.getElementById('stat2Val').innerText = moves;

                    if (flippedCards[0].dataset.icon === flippedCards[1].dataset.icon) {
                        matchedPairs++;
                        flippedCards = [];
                        if (matchedPairs === 6) triggerWin("عبقري! أنهيت اختبار الذاكرة بنجاح.");
                    } else {
                        setTimeout(() => {
                            flippedCards.forEach(c => {
                                c.classList.remove('flipped');
                                c.innerText = '';
                            });
                            flippedCards = [];
                        }, 800);
                    }
                }
            }
        }

        /* --- 3. Fixed Classic Snake Game --- */
        let snake = [], snakeDir = {x: 1, y: 0}, food = {};

        function initSnakeGame() {
            document.getElementById('stat1Label').innerText = "المرحلة";
            document.getElementById('stat1Val').innerText = "1";
            document.getElementById('stat2Label').innerText = "النقاط";
            document.getElementById('stat2Val').innerText = "0";

            const body = document.getElementById('gameBody');
            body.innerHTML = `
                <canvas id="snakeCanvas" width="280" height="280" style="background:#020617; border-radius:12px; border:1px solid var(--border-color);"></canvas>
                <div class="controls-grid">
                    <div></div><button class="ctrl-btn" onclick="setDir(0,-1)">▲</button><div></div>
                    <button class="ctrl-btn" onclick="setDir(-1,0)">◄</button><div></div><button class="ctrl-btn" onclick="setDir(1,0)">►</button>
                    <div></div><button class="ctrl-btn" onclick="setDir(0,1)">▼</button><div></div>
                </div>
            `;
            snake = [{x: 5, y: 5}];
            snakeDir = {x: 1, y: 0};
            food = {x: 10, y: 10};

            if (window.snakeLoop) clearInterval(window.snakeLoop);
            window.snakeLoop = setInterval(updateSnake, 180);
        }

        function setDir(x, y) {
            playSound('click');
            if (x !== -snakeDir.x || y !== -snakeDir.y) {
                snakeDir = {x, y};
            }
        }

        function updateSnake() {
            const head = {x: snake[0].x + snakeDir.x, y: snake[0].y + snakeDir.y};
            if (head.x < 0 || head.x >= 14 || head.y < 0 || head.y >= 14) return initSnakeGame();

            snake.unshift(head);
            if (head.x === food.x && head.y === food.y) {
                playSound('pop');
                let score = parseInt(document.getElementById('stat2Val').innerText) + 10;
                document.getElementById('stat2Val').innerText = score;
                food = {Math: Math.floor(Math.random()*14), y: Math.floor(Math.random()*14)};
                if (score >= 50) { clearInterval(window.snakeLoop); triggerWin("أحسنت! وصلت للهدف بنجاح."); }
            } else {
                snake.pop();
            }

            const canvas = document.getElementById('snakeCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0,0,280,280);

            ctx.fillStyle = '#ef4444';
            ctx.fillRect(food.x*20, food.y*20, 18, 18);

            ctx.fillStyle = '#38bdf8';
            snake.forEach(s => ctx.fillRect(s.x*20, s.y*20, 18, 18));
        }

        /* --- 4. Block Blast Fix (No RTL Flip) --- */
        function initBlockBlast() {
            document.getElementById('stat1Label').innerText = "المرحلة";
            document.getElementById('stat1Val').innerText = "1";
            document.getElementById('stat2Label').innerText = "النقاط";
            document.getElementById('stat2Val').innerText = "0";

            const body = document.getElementById('gameBody');
            body.innerHTML = `<div class="block-grid" id="blockGrid"></div>`;
            const grid = document.getElementById('blockGrid');

            for (let i = 0; i < 64; i++) {
                const cell = document.createElement('div');
                cell.className = 'block-cell';
                cell.onclick = () => {
                    cell.classList.toggle('filled');
                    playSound('pop');
                };
                grid.appendChild(cell);
            }
        }

        /* --- 5. Connect Animals Fix (Dense Grid) --- */
        let selectedAnimal = null;

        function initConnectGame() {
            document.getElementById('stat1Label').innerText = "المرحلة";
            document.getElementById('stat1Val').innerText = "2";
            document.getElementById('stat2Label').innerText = "النقاط";
            document.getElementById('stat2Val').innerText = "0";

            const body = document.getElementById('gameBody');
            body.innerHTML = `<div class="connect-grid" id="connGrid"></div>`;
            const grid = document.getElementById('connGrid');

            const animals = ['🐶', '🐱', '🦊', '🐻', '🐰', '🐼', '🐹', '🐭'];
            let items = [];
            // Create dense pairs (12 pairs = 24 filled cells)
            for (let i = 0; i < 12; i++) {
                let a = animals[i % animals.length];
                items.push(a, a);
            }
            items.sort(() => Math.random() - 0.5);

            items.forEach((anim, idx) => {
                const cell = document.createElement('div');
                cell.className = 'connect-cell';
                cell.innerText = anim;
                cell.onclick = () => handleConnectClick(cell);
                grid.appendChild(cell);
            });
        }

        function handleConnectClick(cell) {
            if (cell.classList.contains('empty')) return;
            playSound('pop');

            if (!selectedAnimal) {
                selectedAnimal = cell;
                cell.classList.add('selected');
            } else if (selectedAnimal === cell) {
                selectedAnimal.classList.remove('selected');
                selectedAnimal = null;
            } else {
                if (selectedAnimal.innerText === cell.innerText) {
                    selectedAnimal.className = 'connect-cell empty';
                    selectedAnimal.innerText = '';
                    cell.className = 'connect-cell empty';
                    cell.innerText = '';
                    selectedAnimal = null;

                    let remaining = document.querySelectorAll('.connect-cell:not(.empty)').length;
                    if (remaining === 0) triggerWin("عاش! نظفت جميع الحيوانات بمهارة.");
                } else {
                    selectedAnimal.classList.remove('selected');
                    selectedAnimal = cell;
                    cell.classList.add('selected');
                }
            }
        }
    </script>
</body>
</html>
