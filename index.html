<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>مركز الألعاب المتطور</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(23, 32, 54, 0.8);
            --accent-color: #00d2ff;
            --accent-green: #00e676;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #1a233a 0%, #0b0f19 100%);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            width: 100vw;
            height: 100vh;
            padding: 20px 15px;
            position: absolute;
            top: 0;
            left: 0;
            background: transparent;
        }

        .active {
            display: flex;
        }

        .header-title {
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(45deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
        }

        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 340px;
            margin: auto 0;
        }

        .btn-game {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 16px;
            border-radius: 16px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s ease;
        }

        .btn-game:active {
            transform: scale(0.97);
            border-color: var(--accent-color);
        }

        .btn-back {
            background: #ff5252;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 82, 82, 0.4);
            margin-bottom: 10px;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 340px;
            background: var(--card-bg);
            padding: 12px 20px;
            border-radius: 14px;
            font-weight: bold;
            font-size: 16px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* --- 1. Snake Game UI --- */
        #snakeCanvas {
            border: 2px solid rgba(0, 210, 255, 0.3);
            background: rgba(0, 0, 0, 0.6);
            border-radius: 16px;
            box-shadow: 0 0 20px rgba(0,210,255,0.15);
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(3, 55px);
            grid-template-rows: repeat(3, 55px);
            gap: 8px;
            margin: 10px 0;
        }

        .ctrl-btn {
            background: var(--card-bg);
            color: var(--accent-color);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- 2 & 5. Tile & Onet Games UI --- */
        .grid-board {
            display: grid;
            gap: 8px;
            background: var(--card-bg);
            padding: 12px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .tile-card {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.1);
            perspective: 1000px;
            transition: transform 0.2s;
        }

        .tile-card.back {
            background: linear-gradient(135deg, #334155, #1e293b);
            color: transparent;
        }

        .tile-card.selected {
            border-color: var(--accent-color);
            transform: scale(1.05);
            box-shadow: 0 0 12px var(--accent-color);
        }

        /* --- 3. Color Sort UI --- */
        .bottles-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: auto 0;
        }

        .bottle {
            width: 45px;
            height: 140px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 0 0 20px 20px;
            display: flex;
            flex-direction: column-reverse;
            overflow: hidden;
            background: rgba(0,0,0,0.3);
            cursor: pointer;
        }

        .bottle.selected {
            border-color: var(--accent-color);
            transform: translateY(-10px);
        }

        .color-layer {
            width: 100%;
            height: 25%;
        }

        /* --- 4. Block Blast 8x8 UI --- */
        #bb-board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            gap: 3px;
            width: 320px;
            height: 320px;
            background: var(--card-bg);
            padding: 8px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .bb-cell {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
        }

        .bb-cell.filled {
            background: linear-gradient(135deg, #ff007f, #7928ca);
            box-shadow: 0 0 8px rgba(255, 0, 127, 0.5);
        }
    </style>
</head>
<body>

    <!-- القائمة الرئيسية -->
    <div id="main-menu" class="screen active">
        <div class="header-title">مركز الألعاب المتطور</div>
        <div class="menu-container">
            <button class="btn-game" onclick="showScreen('snake-screen'); startSnake();">🎮 لعبة الثعبان <span>◄</span></button>
            <button class="btn-game" onclick="showScreen('match-screen'); startTileMatch();">🎴 لعبة المطابقة (مقلوبة) <span>◄</span></button>
            <button class="btn-game" onclick="showScreen('sort-screen'); startColorSort();">🧪 فرز الألوان <span>◄</span></button>
            <button class="btn-game" onclick="showScreen('bb-screen'); startBlockBlast();">🧩 Block Blast (8x8) <span>◄</span></button>
            <button class="btn-game" onclick="showScreen('onet-screen'); startOnet();">🔗 المسار المفتوح (بدون وقت) <span>◄</span></button>
        </div>
    </div>

    <!-- 1. الثعبان المتطور -->
    <div id="snake-screen" class="screen">
        <div class="stats-bar">
            <span>النقاط: <span id="snake-score">0</span></span>
            <span>المرحلة: <span id="snake-level">1</span></span>
        </div>
        <canvas id="snakeCanvas" width="280" height="280"></canvas>
        <div class="controls">
            <div></div><button class="ctrl-btn" onclick="setSnakeDir('UP')">▲</button><div></div>
            <button class="ctrl-btn" onclick="setSnakeDir('LEFT')">◄</button>
            <div></div>
            <button class="ctrl-btn" onclick="setSnakeDir('RIGHT')">►</button>
            <div></div><button class="ctrl-btn" onclick="setSnakeDir('DOWN')">▼</button><div></div>
        </div>
        <button class="btn-back" onclick="showScreen('main-menu')">الرئيسية</button>
    </div>

    <!-- 2. المطابقة (مقلوبة + وقت تصاعدي) -->
    <div id="match-screen" class="screen">
        <div class="stats-bar">
            <span>الوقت المتبقي: <span id="match-time">10</span>s</span>
            <span>المرحلة: <span id="match-level">1</span></span>
        </div>
        <div id="match-grid" class="grid-board"></div>
        <button class="btn-back" onclick="showScreen('main-menu')">الرئيسية</button>
    </div>

    <!-- 3. فرز الألوان -->
    <div id="sort-screen" class="screen">
        <div class="stats-bar">
            <span>فرز الألوان</span>
            <span>المرحلة: <span id="sort-level">1</span></span>
        </div>
        <div id="bottles-container" class="bottles-container"></div>
        <button class="btn-back" onclick="showScreen('main-menu')">الرئيسية</button>
    </div>

    <!-- 4. Block Blast (8x8) -->
    <div id="bb-screen" class="screen">
        <div class="stats-bar">
            <span>النقاط: <span id="bb-score">0</span></span>
            <span>شبكة 8x8</span>
        </div>
        <div id="bb-board"></div>
        <button class="btn-back" onclick="showScreen('main-menu')">الرئيسية</button>
    </div>

    <!-- 5. المسار المفتوح (بدون تايم) -->
    <div id="onet-screen" class="screen">
        <div class="stats-bar">
            <span>المرحلة: <span id="onet-level">1</span></span>
            <span>بدون وقت (مراحل لا نهائية)</span>
        </div>
        <div id="onet-grid" class="grid-board"></div>
        <button class="btn-back" onclick="showScreen('main-menu')">الرئيسية</button>
    </div>

    <script>
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            clearInterval(snakeInterval);
            clearInterval(matchTimer);
        }

        /* --- 1. الثعبان المتطور --- */
        let snakeCanvas = document.getElementById('snakeCanvas');
        let ctx = snakeCanvas.getContext('2d');
        let snake, food, snakeDir, snakeScore, snakeLevel, snakeInterval;

        function startSnake() {
            snake = [{x: 7, y: 7}];
            food = {x: 3, y: 3};
            snakeDir = 'RIGHT';
            snakeScore = 0;
            snakeLevel = 1;
            document.getElementById('snake-score').innerText = snakeScore;
            document.getElementById('snake-level').innerText = snakeLevel;
            runSnake();
        }

        function setSnakeDir(dir) {
            if(dir === 'UP' && snakeDir !== 'DOWN') snakeDir = 'UP';
            if(dir === 'DOWN' && snakeDir !== 'UP') snakeDir = 'DOWN';
            if(dir === 'LEFT' && snakeDir !== 'RIGHT') snakeDir = 'LEFT';
            if(dir === 'RIGHT' && snakeDir !== 'LEFT') snakeDir = 'RIGHT';
        }

        function runSnake() {
            clearInterval(snakeInterval);
            // زيادة بطيئة جداً وهادئة في السرعة
            let speed = Math.max(90, 170 - (snakeLevel * 4));
            snakeInterval = setInterval(updateSnake, speed);
        }

        function updateSnake() {
            let head = {...snake[0]};
            if(snakeDir === 'UP') head.y--;
            if(snakeDir === 'DOWN') head.y++;
            if(snakeDir === 'LEFT') head.x--;
            if(snakeDir === 'RIGHT') head.x++;

            if(head.x < 0 || head.x >= 14 || head.y < 0 || head.y >= 14 || snake.some(s => s.x === head.x && s.y === head.y)) {
                alert('انتهت اللعبة!');
                startSnake();
                return;
            }

            snake.unshift(head);
            if(head.x === food.x && head.y === food.y) {
                snakeScore += 10;
                snakeLevel = Math.floor(snakeScore / 40) + 1;
                document.getElementById('snake-score').innerText = snakeScore;
                document.getElementById('snake-level').innerText = snakeLevel;
                food = {x: Math.floor(Math.random()*14), y: Math.floor(Math.random()*14)};
                runSnake();
            } else {
                snake.pop();
            }

            ctx.fillStyle = '#0b0f19';
            ctx.fillRect(0, 0, 280, 280);

            // رسم الطعام
            ctx.fillStyle = '#ff007f';
            ctx.beginPath();
            ctx.arc(food.x*20 + 10, food.y*20 + 10, 8, 0, Math.PI*2);
            ctx.fill();

            // رسم الثعبان
            ctx.fillStyle = '#00d2ff';
            snake.forEach((s, idx) => {
                ctx.fillRect(s.x*20 + 1, s.y*20 + 1, 18, 18);
            });
        }

        /* --- 2. لعبة المطابقة (الكروت مقلوبة + وقت تصاعدي) --- */
        let matchLevel = 1;
        let matchTimer, matchTime;
        let selectedCards = [];
        const cardIcons = ['🍎', '🍌', '🍇', '🍊', '🍓', '🥑'];

        function getMatchTimeForLevel(lvl) {
            if(lvl === 1) return 10;
            if(lvl === 2) return 20;
            if(lvl === 3) return 25;
            if(lvl === 4) return 30;
            return 30 + ((lvl - 4) * 5); // يزيد 5 ثوانٍ بعد ذلك لكل مرحلة
        }

        function startTileMatch() {
            matchTime = getMatchTimeForLevel(matchLevel);
            document.getElementById('match-time').innerText = matchTime;
            document.getElementById('match-level').innerText = matchLevel;

            let grid = document.getElementById('match-grid');
            grid.style.gridTemplateColumns = 'repeat(3, 1fr)';
            grid.innerHTML = '';
            selectedCards = [];

            let items = [...cardIcons.slice(0, 3), ...cardIcons.slice(0, 3)].sort(() => Math.random() - 0.5);
            items.forEach(icon => {
                let card = document.createElement('div');
                card.className = 'tile-card back';
                card.dataset.icon = icon;
                card.innerText = '❓'; // ظهر الكارت المقلوب
                card.onclick = () => flipCard(card);
                grid.appendChild(card);
            });

            clearInterval(matchTimer);
            matchTimer = setInterval(() => {
                matchTime--;
                document.getElementById('match-time').innerText = matchTime;
                if(matchTime <= 0) {
                    clearInterval(matchTimer);
                    alert('انتهى الوقت!');
                    matchLevel = 1;
                    startTileMatch();
                }
            }, 1000);
        }

        function flipCard(card) {
            if(selectedCards.length < 2 && card.classList.contains('back')) {
                card.classList.remove('back');
                card.innerText = card.dataset.icon;
                card.classList.add('selected');
                selectedCards.push(card);

                if(selectedCards.length === 2) {
                    if(selectedCards[0].dataset.icon === selectedCards[1].dataset.icon) {
                        selectedCards = [];
                        let allFlipped = [...document.querySelectorAll('#match-grid .tile-card')].every(c => !c.classList.contains('back'));
                        if(allFlipped) {
                            clearInterval(matchTimer);
                            setTimeout(() => {
                                alert('أحسنت! انتقلت للمرحلة التالية');
                                matchLevel++;
                                startTileMatch();
                            }, 300);
                        }
                    } else {
                        setTimeout(() => {
                            selectedCards.forEach(c => {
                                c.classList.add('back');
                                c.innerText = '❓';
                                c.classList.remove('selected');
                            });
                            selectedCards = [];
                        }, 600);
                    }
                }
            }
        }

        /* --- 3. لعبة فرز الألوان (Color Sort) --- */
        let bottles = [
            ['#ff0055', '#00d2ff', '#ff0055', '#00d2ff'],
            ['#00d2ff', '#ff0055', '#00d2ff', '#ff0055'],
            []
        ];
        let selectedBottle = null;

        function startColorSort() {
            renderBottles();
        }

        function renderBottles() {
            let container = document.getElementById('bottles-container');
            container.innerHTML = '';
            bottles.forEach((b, idx) => {
                let div = document.createElement('div');
                div.className = 'bottle' + (selectedBottle === idx ? ' selected' : '');
                div.onclick = () => handleBottleClick(idx);
                b.forEach(color => {
                    let layer = document.createElement('div');
                    layer.className = 'color-layer';
                    layer.style.backgroundColor = color;
                    div.appendChild(layer);
                });
                container.appendChild(div);
            });
        }

        function handleBottleClick(idx) {
            if(selectedBottle === null) {
                if(bottles[idx].length > 0) selectedBottle = idx;
            } else {
                if(selectedBottle !== idx) {
                    let from = bottles[selectedBottle];
                    let to = bottles[idx];
                    if(to.length < 4) {
                        let color = from.pop();
                        to.push(color);
                    }
                }
                selectedBottle = null;
            }
            renderBottles();
        }

        /* --- 4. Block Blast (8x8) --- */
        function startBlockBlast() {
            let board = document.getElementById('bb-board');
            board.innerHTML = '';
            for(let i=0; i<64; i++) {
                let cell = document.createElement('div');
                cell.className = 'bb-cell';
                cell.onclick = () => cell.classList.toggle('filled');
                board.appendChild(cell);
            }
        }

        /* --- 5. المسار المفتوح (Onet - بدون تايم) --- */
        let onetLevel = 1;
        let onetSel = null;
        const onetIcons = ['🐶', '🐱', '🐭', '🐹'];

        function startOnet() {
            document.getElementById('onet-level').innerText = onetLevel;
            let grid = document.getElementById('onet-grid');
            grid.style.gridTemplateColumns = 'repeat(4, 1fr)';
            grid.innerHTML = '';

            let deck = [...onetIcons, ...onetIcons, ...onetIcons].sort(() => Math.random() - 0.5);
            deck.forEach(icon => {
                let card = document.createElement('div');
                card.className = 'tile-card';
                card.innerText = icon;
                card.dataset.icon = icon;
                card.onclick = () => handleOnet(card);
                grid.appendChild(card);
            });
        }

        function handleOnet(card) {
            if(card.style.visibility === 'hidden') return;
            if(!onetSel) {
                onetSel = card;
                card.classList.add('selected');
            } else if(onetSel === card) {
                onetSel.classList.remove('selected');
                onetSel = null;
            } else {
                if(onetSel.dataset.icon === card.dataset.icon) {
                    onetSel.style.visibility = 'hidden';
                    card.style.visibility = 'hidden';
                    onetSel.classList.remove('selected');
                    onetSel = null;

                    let rem = [...document.querySelectorAll('#onet-grid .tile-card')].filter(c => c.style.visibility !== 'hidden');
                    if(rem.length === 0) {
                        alert('ممتاز! المرحلة التالية');
                        onetLevel++;
                        startOnet();
                    }
                } else {
                    onetSel.classList.remove('selected');
                    onetSel = card;
                    card.classList.add('selected');
                }
            }
        }
    </script>
</body>
</html>
